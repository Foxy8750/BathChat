<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BathChat - Leaderboard</title>
  <link rel="stylesheet" href="shared/styles.css">
</head>
<body>
  <nav>
    <a href="index.html" class="logo">🛁 BathChat</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="auth.html">Auth</a></li>
      <li><a href="profile.html">Profile</a></li>
      <li><a href="discovery.html">Discovery</a></li>
      <li><a href="connections.html">Connections</a></li>
      <li><a href="leaderboard.html" class="active">Leaderboard</a></li>
    </ul>
    <div class="nav-right">
      <div class="user-info">
        User: <span id="userIdDisplay">1</span>
      </div>
    </div>
  </nav>

  <main>
    <section>
      <h1>Leaderboard</h1>
      <p style="color: var(--text-secondary); margin-bottom: 2rem;">See who's leading the rankings by experience points.</p>

      <div class="cards-grid">
        <form id="leaderboardForm" style="grid-column: 1 / -1;">
          <h3>Top EXP Leaderboard</h3>
          <p style="color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 1rem;">View the top users by experience points and their badges.</p>
          <button type="submit">GET /leaderboard/top-exp</button>
        </form>
      </div>

      <div id="leaderboardContent" style="display: none; margin-top: 2rem;">
        <h2 style="margin-bottom: 1rem;">Rankings</h2>
        <div style="background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow-x: auto;">
          <table style="width: 100%; border-collapse: collapse;">
            <thead>
              <tr style="background: rgba(98, 208, 255, 0.1);">
                <th style="padding: 1rem; text-align: left; border-bottom: 1px solid var(--border);">#</th>
                <th style="padding: 1rem; text-align: left; border-bottom: 1px solid var(--border);">Name</th>
                <th style="padding: 1rem; text-align: left; border-bottom: 1px solid var(--border);">Badge</th>
                <th style="padding: 1rem; text-align: right; border-bottom: 1px solid var(--border);">EXP</th>
              </tr>
            </thead>
            <tbody id="leaderboardBody">
            </tbody>
          </table>
        </div>
      </div>

      <h2 style="margin-top: 3rem; margin-bottom: 1rem;">Response Output</h2>
      <div id="apiOutput"></div>
    </section>
  </main>

  <script src="shared/api-client.js"></script>
  <script>
    // Badge emojis
    const badgeEmojis = {
      bronze: '🥉',
      silver: '🥈',
      gold: '🥇',
      platinum: '💎',
      diamond: '✨',
    };

    document.getElementById('leaderboardForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = await callApi({ method: 'GET', path: '/leaderboard/top-exp' });
      
      if (data && data.data) {
        const tbody = document.getElementById('leaderboardBody');
        tbody.innerHTML = '';
        
        data.data.forEach((user, index) => {
          const row = document.createElement('tr');
          row.style.borderBottom = '1px solid var(--border)';
          row.innerHTML = `
            <td style="padding: 1rem; color: var(--text-secondary);">${index + 1}</td>
            <td style="padding: 1rem;">${user.user_name || 'User ' + user.user_id}</td>
            <td style="padding: 1rem;">
              ${badgeEmojis[user.badge_tier] || '•'} 
              <span style="color: var(--accent); font-weight: 600;">${user.badge_tier}</span>
            </td>
            <td style="padding: 1rem; text-align: right; color: var(--accent); font-weight: 600;">${user.exp_points} XP</td>
          `;
          tbody.appendChild(row);
        });
        
        document.getElementById('leaderboardContent').style.display = 'block';
      }
    });

    document.getElementById('userIdDisplay').textContent = getUserId();
  </script>
</body>
</html>
