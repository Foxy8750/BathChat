<!DOCTYPE html>
<html>
<head>
  <title>API Test</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #fff; }
    pre { background: #222; padding: 10px; border-radius: 4px; overflow-x: auto; }
  </style>
</head>
<body>
  <h1>API Test</h1>
  <button onclick="testAuth()">Test Auth Endpoint</button>
  <button onclick="testCors()">Test CORS Preflight</button>
  <button onclick="clearLog()">Clear Log</button>
  
  <h2>Log:</h2>
  <pre id="log"></pre>

  <script>
    function log(msg) {
      const el = document.getElementById('log');
      el.textContent += new Date().toLocaleTimeString() + ': ' + msg + '\n';
      el.scrollTop = el.scrollHeight;
    }

    function clearLog() {
      document.getElementById('log').textContent = '';
    }

    async function testAuth() {
      log('Testing /auth/me...');
      try {
        const response = await fetch('http://127.0.0.1:8770/auth/me', {
          method: 'GET',
          headers: {
            'X-User-Id': '1',
          }
        });
        log(`Response status: ${response.status}`);
        const data = await response.json();
        log(`Response: ${JSON.stringify(data)}`);
      } catch (e) {
        log(`Error: ${e.message}`);
      }
    }

    async function testCors() {
      log('Testing CORS preflight...');
      try {
        const response = await fetch('http://127.0.0.1:8770/auth/login', {
          method: 'OPTIONS',
          headers: {
            'Origin': 'http://127.0.0.1:5500',
            'Access-Control-Request-Method': 'POST',
            'Access-Control-Request-Headers': 'content-type',
          }
        });
        log(`CORS response status: ${response.status}`);
        const headers = {};
        for (const [k, v] of response.headers.entries()) {
          if (k.includes('access-control') || k.includes('Access-Control')) {
            headers[k] = v;
          }
        }
        log(`CORS headers: ${JSON.stringify(headers)}`);
      } catch (e) {
        log(`CORS Error: ${e.message}`);
      }
    }

    log('Test page loaded');
    log('Base URL: http://127.0.0.1:8770');
    log('Frontend URL: http://127.0.0.1:5500');
  </script>
</body>
</html>
